name: Focus
options:
  bundleIdPrefix: com.tohraan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9RDX89K237
targets:
  Focus:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tohraan.focus-dr
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: FOCUS
        NSCameraUsageDescription: "FOCUS processes the live camera feed on-device to hide people from the displayed view. Nothing is recorded or uploaded."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
