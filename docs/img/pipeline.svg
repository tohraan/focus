<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" font-family="Helvetica, Arial, sans-serif">
<rect width="1600" height="600" fill="#0B0F1A"/>
<text x="60" y="60" font-size="30" font-weight="700" fill="#fff">FOCUS: on-device pipeline (iPhone 15, no network, nothing stored)</text>
<g font-size="19" fill="#fff" text-anchor="middle">
<rect x="50" y="120" width="260" height="170" rx="16" fill="#1E2A4A"/><text x="180" y="160" font-weight="700">ARKit</text><text x="180" y="196" font-size="16" fill="#AFC0E8">camera frame + pose</text><text x="180" y="224" font-size="16" fill="#AFC0E8">intrinsics, tracking state</text>
<rect x="350" y="120" width="260" height="170" rx="16" fill="#1E2A4A"/><text x="480" y="160" font-weight="700">Person mask</text><text x="480" y="196" font-size="16" fill="#AFC0E8">Vision segmentation</text><text x="480" y="224" font-size="16" fill="#AFC0E8">+ YOLO11 seg extras</text>
<rect x="650" y="120" width="260" height="170" rx="16" fill="#1E2A4A"/><text x="780" y="160" font-weight="700">Scene memory</text><text x="780" y="196" font-size="16" fill="#AFC0E8">still-camera plate</text><text x="780" y="224" font-size="16" fill="#AFC0E8">pose-aware keyframes</text>
<rect x="950" y="120" width="260" height="170" rx="16" fill="#1E2A4A"/><text x="1080" y="160" font-weight="700">Fill</text><text x="1080" y="196" font-size="16" fill="#AFC0E8">real pixels first</text><text x="1080" y="224" font-size="16" fill="#AFC0E8">MI-GAN for unseen areas</text>
<rect x="1250" y="120" width="300" height="170" rx="16" fill="#F2B84B"/><text x="1400" y="160" font-weight="700" fill="#0B0F1A">Metal compositor</text><text x="1400" y="196" font-size="16" fill="#0B0F1A">people replaced by background</text><text x="1400" y="224" font-size="16" fill="#0B0F1A">original / processed toggle</text>
</g>
<g stroke="#fff" stroke-width="3"><path d="M310 205h40M610 205h40M910 205h40M1210 205h40"/></g>
<g fill="#fff"><path d="M350 205l-12-8v16zM650 205l-12-8v16zM950 205l-12-8v16zM1250 205l-12-8v16z"/></g>
<g font-size="20" fill="#AFC0E8"><text x="60" y="370">Measured on iPhone 15 (A16): Depth Anything V2 on the Neural Engine 28 ms · MI-GAN on CPU+GPU (the Neural Engine gave wrong output)</text>
<text x="60" y="410">Honest by design: regions never seen are flagged as generated, never presented as real.</text>
<text x="60" y="450">Safety: this filters the screen, not the world. A persistent notice says "Do not walk while using".</text>
<text x="60" y="490">Privacy: no recording, no upload, no face recognition, no identification.</text></g>
</svg>
